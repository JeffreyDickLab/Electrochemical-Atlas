name: Validate source and offline build
on:
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF.js dependency
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Build client and check source
        run: |
          npm run test:all
          npm run test:package
      - name: Browser acceptance test of bundled PDF.js
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser/pdfjs_equation_smoke.py
          npm run test:browser
      - name: Launcher tests and formatting
        run: |
          go test ./src/launcher
          go vet ./src/launcher
          test -z "$(gofmt -l src/launcher/*.go)"
